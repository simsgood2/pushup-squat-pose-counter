<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모캡 디펜스</title>
    <style>
      :root {
        --bg-deep: #07090d;
        --bg-panel: rgba(14, 18, 24, 0.85);
        --accent-cyan: #00ffd1;
        --accent-blue: #4d8aff;
        --warn: #ff3360;
        --text-base: #e6f1ff;
        --text-dim: #7d92b0;
        --border-faint: rgba(0, 255, 209, 0.25);
        --shadow-glow: 0 0 12px rgba(0, 255, 209, 0.35);
      }
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%;
        background: var(--bg-deep); color: var(--text-base);
        font-family: 'JetBrains Mono', 'Consolas', monospace; }
      #game-canvas { display: block; }

      .hud-panel { background: var(--bg-panel); border: 1px solid var(--border-faint);
        border-radius: 8px; padding: 10px 16px; backdrop-filter: blur(6px); }
      .hud-btn { background: transparent; border: 1px solid var(--accent-cyan);
        color: var(--accent-cyan); padding: 6px 14px; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 14px; letter-spacing: 0.04em;
        transition: box-shadow 0.15s, background 0.15s; }
      .hud-btn:hover { box-shadow: var(--shadow-glow); background: rgba(0, 255, 209, 0.08); }
      .hud-btn:disabled { border-color: var(--text-dim); color: var(--text-dim);
        cursor: not-allowed; box-shadow: none; }
      .hud-label-dim { color: var(--text-dim); }
      .hud-overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: rgba(7, 9, 13, 0.85);
        backdrop-filter: blur(8px); z-index: 200; }
      .hud-overlay h1 { color: var(--accent-cyan); font-size: 36px; letter-spacing: 0.1em;
        text-shadow: var(--shadow-glow); margin-bottom: 24px; }

      @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-40px); opacity: 0; }
      }

      @keyframes lifeFlash {
        0% { opacity: 0; } 30% { opacity: 0.35; } 100% { opacity: 0; }
      }

      @keyframes exerciseFloat {
        0%   { transform: translate(-50%, 0) scale(0.85); opacity: 0; }
        10%  { transform: translate(-50%, -8px) scale(1.12); opacity: 1; }
        65%  { transform: translate(-50%, -46px) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -82px) scale(1); opacity: 0; }
      }
      .exercise-float { position: fixed; pointer-events: none; z-index: 150; white-space: nowrap;
        text-align: center; font-weight: bold; will-change: transform, opacity;
        animation: exerciseFloat 1.6s ease-out forwards; }
      .ef-name { color: var(--accent-cyan); font-size: 20px; text-shadow: 0 0 8px rgba(0, 255, 209, 0.6); }
      .ef-gold { color: #ffe27a; font-size: 18px; text-shadow: 0 0 8px rgba(255, 210, 80, 0.6); }
      .ef-combo { display: block; margin-top: 2px; color: var(--accent-blue); font-size: 15px;
        letter-spacing: 0.06em; text-shadow: 0 0 8px rgba(77, 138, 255, 0.6); }

      @keyframes phaseSweep {
        0%   { transform: translate(-50%, -50%) translateX(-72vw); opacity: 0; }
        18%  { transform: translate(-50%, -50%) translateX(0); opacity: 1; }
        72%  { transform: translate(-50%, -50%) translateX(0); opacity: 1; }
        100% { transform: translate(-50%, -50%) translateX(72vw); opacity: 0; }
      }
      .phase-banner { position: fixed; top: 38%; left: 50%;
        transform: translate(-50%, -50%); pointer-events: none; z-index: 180; white-space: nowrap;
        font-size: clamp(40px, 8vw, 96px); font-weight: 800; letter-spacing: 0.14em;
        color: var(--accent-cyan);
        text-shadow: 0 0 24px rgba(0, 255, 209, 0.55), 0 0 6px rgba(0, 255, 209, 0.85);
        will-change: transform, opacity;
        animation: phaseSweep 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
